version: 2

updates:

  # Go dependencies (entire repo)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"

  # Dashboard (Next.js admin CMS) dependencies — the app the kios fork actually
  # deploys to Vercel. The upstream /web/frontend Vite app is unused here.
  - package-ecosystem: "npm"
    directory: "/kios-dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "dashboard"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"